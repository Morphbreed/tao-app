<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cache-Messung</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 system-ui, sans-serif; margin: 0;
         padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.25rem
                  calc(1.25rem + env(safe-area-inset-bottom, 0px));
         background: #f7f4ee; color: #2a2725; }
  @media (prefers-color-scheme: dark) { body { background: #161614; color: #e8e2d8; } }
  h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .sub { font-size: .85rem; margin: 0 0 1.25rem; opacity: .75; }
  .row { display: flex; gap: .6rem; align-items: baseline;
         padding: .45rem 0; border-bottom: 1px solid rgba(128,120,110,.35); }
  .mark { width: 1.2rem; flex: none; font-weight: 700; }
  .ok { color: #2e7d32; } .bad { color: #c62828; } .warn { color: #b26a00; }
  .path { flex: 1; font-family: ui-monospace, monospace; font-size: .72rem;
          word-break: break-all; }
  .ms { flex: none; font-variant-numeric: tabular-nums; font-size: .82rem; }
  #verdict { margin-top: 1.25rem; padding: .9rem; border-radius: 10px;
             border: 1px solid rgba(128,120,110,.35); }
  code { padding: .1rem .3rem; border-radius: 3px; font-size: .85em;
         background: rgba(128,120,110,.2); }
  button { font: inherit; font-size: .9rem; margin-top: 1rem; padding: .6rem 1.1rem;
           color: #fffdf8; background: #7a6a52; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Cache-Messung</h1>
<p class="sub" id="version">Service Worker: wird abgefragt …</p>
<div id="taps" style="margin:0 0 1.25rem;padding:.9rem;border-radius:10px;border:1px solid rgba(128,120,110,.35)">Tipp-Protokoll wird gelesen \u2026</div>
<div id="live" style="margin:0 0 1.25rem;padding:.9rem;border-radius:10px;border:1px solid rgba(128,120,110,.35)">Protokoll wird abgefragt \u2026</div>
<div id="out"></div>
<div id="verdict">wird gemessen …</div>
<button type="button" onclick="location.reload()">Nochmal messen</button>
<script>
const out = document.getElementById("out");

function row(mark, cls, path, detail) {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = '<span class="mark ' + cls + '">' + mark + "</span>"
    + '<span class="path">' + path + "</span>"
    + '<span class="ms">' + detail + "</span>";
  out.appendChild(el);
}

const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
if (ctrl) {
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (!e.data || e.data.type !== "stats") return;
    document.getElementById("version").textContent =
      "Service Worker im Einsatz: " + e.data.version;

    // Das Protokoll der Anfragen, die beim Bl\u00e4ttern tats\u00e4chlich durchliefen.
    const entries = e.data.log || [];
    const slow = entries.filter((x) => x.ms >= 300);
    const miss = entries.filter((x) => !x.hit);
    const box = document.getElementById("live");
    if (entries.length === 0) {
      box.innerHTML = "<strong>Kein Protokoll.</strong> Der Worker wurde zwischendurch "
        + "beendet. Bl\u00e4ttere kurz in der App und ruf diese Seite dann sofort wieder auf.";
      return;
    }
    box.innerHTML = "<strong>Letzte " + entries.length + " Anfragen beim Bl\u00e4ttern:</strong> "
      + miss.length + " Fehltreffer, " + slow.length + " langsamer als 300 ms."
      + (miss.length || slow.length
          ? "<br><br>" + entries.filter((x) => !x.hit || x.ms >= 300)
              .map((x) => (x.hit ? "\u2713" : "\u2717") + " " + x.ms + " ms \u00b7 <code>"
                + x.path + "</code>").join("<br>")
          : "<br><br>Alles aus dem Cache und schnell \u2014 der Service Worker ist "
            + "an der Verz\u00f6gerung nicht beteiligt.");
  });
  ctrl.postMessage({ type: "stats" });
  setTimeout(() => {
    const el = document.getElementById("version");
    if (el.textContent.indexOf("wird abgefragt") !== -1) {
      el.textContent = "Service Worker antwortet nicht — vermutlich eine alte Fassung.";
    }
  }, 2500);
} else {
  document.getElementById("version").textContent =
    "KEIN Service Worker im Einsatz — alles geht direkt ins Netz.";
}

// Was beim Tippen in der App tatsaechlich passiert ist.
(function () {
  const box = document.getElementById("taps");
  let log = [];
  try { log = JSON.parse(localStorage.getItem("tao-tap-log") || "[]"); } catch (e) {}

  if (log.length === 0) {
    box.innerHTML = "<strong>Kein Tipp-Protokoll.</strong> Tippe in der App auf ein paar "
      + "Links \u2014 auch die, die erst beim zweiten Mal reagieren \u2014 und ruf diese "
      + "Seite danach wieder auf.";
    return;
  }

  const start = log[0].t;
  box.innerHTML = "<strong>Tipp-Protokoll (" + log.length + " Ereignisse):</strong><br><br>"
    + log.map(function (e) {
        const dt = String(e.t - start).padStart(5, " ");
        const mark = e.kind === "ROUTE GEWECHSELT" ? "\u2192" : "\u00b7";
        return "<code>" + dt + " ms " + mark + " " + e.kind + " \u2014 " + e.detail + "</code>";
      }).join("<br>")
    + '<br><br><button type="button" onclick="localStorage.removeItem(\'tao-tap-log\');location.reload()">'
    + "Protokoll leeren</button>";
})();

// Seiten, die beim Bl\u00e4ttern aufgerufen werden.
const TESTS = [
  "/",
  "/daodejing/",
  "/daodejing/42/",
  "/meditation/zuowang/",
  "/geschichten/der-koch/",
  "/woerter/",
];

(async () => {
  // Den Cache direkt fragen statt aus Laufzeiten zu raten. Das ist eindeutig,
  // egal ob der Server laeuft oder nicht.
  let names = [];
  let total = 0;
  try {
    names = await caches.keys();
    for (const n of names) total += (await (await caches.open(n)).keys()).length;
  } catch (e) { /* kein Zugriff */ }

  row("i", "", "Caches: " + (names.join(", ") || "keine"), total + " Eintraege");

  let misses = 0;
  for (const path of TESTS) {
    let hit = false;
    try {
      hit = Boolean(await caches.match(path, { ignoreSearch: true }));
    } catch (e) { hit = false; }
    if (!hit) misses++;

    const started = performance.now();
    let status = 0;
    try {
      const r = await fetch(path);
      status = r.status;
    } catch (e) { status = -1; }
    const ms = Math.round(performance.now() - started);

    row(hit ? "\u2713" : "\u2717", hit ? "ok" : "bad", path,
        (hit ? "im Cache" : "FEHLT") + " \u00b7 " + (status === -1 ? "Fehler" : status) + " \u00b7 " + ms + " ms");
  }

  const v = document.getElementById("verdict");
  v.innerHTML = misses === 0
    ? "<strong>Alle sechs liegen im Cache.</strong> Dann kann beim Bl\u00e4ttern nichts mehr "
      + "auf das Netz warten \u2014 unabh\u00e4ngig davon, was die Millisekunden sagen."
    : "<strong>" + misses + " von " + TESTS.length + " fehlen im Cache.</strong> "
      + "Genau die gehen beim Bl\u00e4ttern ins Netz und kosten die Wartezeit.";
})();
</script>
</body>
</html>
